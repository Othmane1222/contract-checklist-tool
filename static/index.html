<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contract Checklist Tool</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <h1>Contract Checklist Tool</h1>
    <p class="disclaimer">This is an automated checklist, not legal advice.</p>

    <form id="upload-form">
      <label for="contract-type">Contract type</label>
      <select id="contract-type" name="contract_type" required>
        <option value="">Choose…</option>
        <option value="employment">Employment contract</option>
        <option value="lease">Apartment lease</option>
        <option value="business">Business agreement</option>
      </select>
    
      <label for="language">Results language</label>
      <select id="language" name="language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh">中文</option>
      </select>

      <label for="file">Contract file (PDF or DOCX, max 10 MB)</label>
      <input id="file" name="file" type="file" accept=".pdf,.docx" required>

      <button type="submit">Check contract</button>
    </form>

        <p id="status" role="status"></p>
    <p id="error" class="error" role="alert" hidden></p>

    <section id="results" hidden>
      <h2>Results</h2>
      <p class="disclaimer">This is an automated checklist, not legal advice.</p>
      <p id="summary"></p>
      <p id="results-language"></p>
      <label class="toggle">
        <input id="explain-toggle" type="checkbox">
        Explain it to me
      </label>
      <div class="table-wrapper">
        <table id="results-table">
          <thead>
            <tr>
              <th scope="col">Checklist item</th>
              <th scope="col">Found?</th>
              <th scope="col">Risk</th>
              <th scope="col">Short explanation</th>
              <th scope="col">Source quote</th>
              <th scope="col" class="plain-column">In plain words</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
